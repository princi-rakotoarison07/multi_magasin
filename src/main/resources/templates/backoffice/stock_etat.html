<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{backoffice/fragments/shell :: shell(~{::main})}">
<main>
    <section>
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-6">
            <div>
                <div class="text-sm text-slate-500">Gestion des stocks</div>
                <div class="mt-1 flex items-center gap-2">
                    <div class="text-lg font-semibold text-slate-900">État du stock</div>
                    <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700" th:text="'Total: ' + ${produitsStock.size()}">Total: 0</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <a th:href="@{/multi_magasin/backOffice/ventes/historique}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-900/20">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Historique des ventes
                </a>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                    <tr>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Produit</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Catégorie</th>
                        <th class="text-right font-medium px-4 sm:px-6 py-3">Stock Actuel</th>
                        <th class="text-right font-medium px-4 sm:px-6 py-3">Status</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                    <tr th:if="${#lists.isEmpty(produitsStock)}">
                        <td class="px-4 sm:px-6 py-10 text-center text-slate-500" colspan="4">
                            Aucun produit en stock.
                        </td>
                    </tr>

                    <tr class="hover:bg-slate-50 transition-colors" th:each="ps : ${produitsStock}">
                        <td class="px-4 sm:px-6 py-3">
                            <div class="font-medium text-slate-900" th:text="${ps.produit.nom}">Produit</div>
                            <div class="text-xs text-slate-500" th:text="${ps.produit.codeBarre}">Code</div>
                        </td>
                        <td class="px-4 sm:px-6 py-3 text-slate-500" th:text="${ps.produit.categorie != null ? ps.produit.categorie.libelle : '-'}">Catégorie</td>
                        <td class="px-4 sm:px-6 py-3 text-right font-mono font-medium" 
                            th:classappend="${ps.stockActuel <= 0} ? 'text-rose-600' : 'text-emerald-600'"
                            th:text="${ps.stockActuel}">0</td>
                        <td class="px-4 sm:px-6 py-3 text-right">
                             <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                  th:classappend="${ps.stockActuel > 10} ? 'bg-emerald-100 text-emerald-800' : (${ps.stockActuel > 0} ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800')"
                                  th:text="${ps.stockActuel > 10 ? 'En stock' : (ps.stockActuel > 0 ? 'Faible' : 'Rupture')}">Status</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</html>
