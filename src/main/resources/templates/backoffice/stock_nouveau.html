<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{backoffice/fragments/shell :: shell(~{::main})}">
<main th:data-api-produits-url="@{/backOffice/stock/api/produits}" x-data="stockForm()">
    <section>
        <div class="mb-6 flex items-center justify-between">
            <div>
                <a th:href="@{/backOffice/stock}" class="text-sm text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-1">
                    <i class="fa-solid fa-arrow-left"></i> Retour
                </a>
                <h1 class="text-2xl font-bold text-slate-900">Nouveau mouvement de stock</h1>
            </div>
        </div>

        <div th:if="${errorMessage != null || #fields.hasErrors('form.*')}" class="mb-4 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                <div th:text="${errorMessage} ?: 'Veuillez corriger les erreurs ci-dessous'">Erreur</div>
            </div>
            <ul th:if="${#fields.hasErrors('form.*')}" class="mt-2 ml-7 list-disc">
                <li th:each="err : ${#fields.errors('form.*')}" th:text="${err}"></li>
            </ul>
        </div>

        <form th:action="@{/backOffice/stock}" method="post" class="space-y-6">
            <!-- Header Section -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Type de mouvement</label>
                        <select name="typeMouvementId" class="w-full rounded-xl border-slate-200 focus:border-slate-900 focus:ring-slate-900 p-3">
                            <option value="" disabled selected>Sélectionner un type</option>
                            <option th:each="type : ${typesMouvement}" th:value="${type.id}" th:text="${type.libelle}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Date du mouvement</label>
                        <input type="date" name="dateMouvement" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" class="w-full rounded-xl border-slate-200 focus:border-slate-900 focus:ring-slate-900 p-3" />
                    </div>
                </div>
            </div>

            <!-- Lines Section -->
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div class="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                    <h3 class="font-semibold text-slate-900">Produits concernés</h3>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead class="bg-white text-slate-600 border-b border-slate-200">
                        <tr>
                            <th class="text-left font-medium px-4 py-3 w-[40%]">Produit</th>
                            <th class="text-left font-medium px-4 py-3 w-[15%]">Unité</th>
                            <th class="text-left font-medium px-4 py-3 w-[20%]">Quantité</th>
                            <th class="text-right font-medium px-4 py-3 w-[15%]">Est. Total</th>
                            <th class="text-right font-medium px-4 py-3 w-[10%]">Action</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                        <template x-for="(ligne, index) in lignes" :key="index">
                            <tr class="group hover:bg-slate-50">
                                <td class="px-4 py-3 align-top">
                                    <div class="relative" @click.outside="ligne.showSuggestions = false">
                                        <input type="hidden" :name="'lignes[' + index + '].produitId'" x-model="ligne.produitId" required />
                                        <input type="text" 
                                               x-model="ligne.produitQuery" 
                                               @input.debounce.300ms="searchProduit(index)"
                                               @focus="ligne.showSuggestions = true"
                                               placeholder="Rechercher un produit..."
                                               class="w-full rounded-lg border-slate-200 text-sm focus:border-slate-900 focus:ring-slate-900 p-3"
                                               :class="{'border-rose-300': !ligne.produitId && ligne.touched}"
                                               @blur="ligne.touched = true"
                                               autocomplete="off"
                                        />
                                        
                                        <!-- Suggestions Dropdown -->
                                        <div x-show="ligne.showSuggestions && ligne.suggestions.length > 0" 
                                             class="absolute z-10 left-0 top-full mt-1 w-full bg-white rounded-lg border border-slate-200 shadow-lg max-h-60 overflow-y-auto">
                                            <ul>
                                                <template x-for="p in ligne.suggestions" :key="p.id">
                                                    <li @click="selectProduit(index, p)" class="px-3 py-2 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0">
                                                        <div class="font-medium text-slate-900" x-text="p.nom"></div>
                                                        <div class="flex items-center gap-2 text-xs text-slate-500">
                                                            <span x-text="p.codeBarre"></span>
                                                            <span class="text-slate-300">•</span>
                                                            <span x-text="p.categorie"></span>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                        <div x-show="ligne.showSuggestions && ligne.suggestions.length === 0 && ligne.produitQuery.length > 1 && !ligne.loading" class="absolute z-10 left-0 top-full mt-1 w-full bg-white rounded-lg border border-slate-200 shadow-lg p-3 text-center text-slate-500 text-xs">
                                            Aucun produit trouvé
                                        </div>
                                    </div>
                                </td>
                                <td class="px-4 py-3 align-top">
                                    <input type="hidden" :name="'lignes[' + index + '].uniteId'" x-model="ligne.uniteId" />
                                    <div class="w-full rounded-lg border border-slate-200 bg-slate-50 text-sm p-3 text-slate-700" x-text="ligne.uniteLibelle || '-'"></div>
                                </td>
                                <td class="px-4 py-3 align-top">
                                    <input type="number" 
                                           :name="'lignes[' + index + '].quantite'" 
                                           x-model="ligne.quantite" 
                                           min="0.001" 
                                           step="0.001"
                                           required
                                           class="w-full rounded-lg border-slate-200 text-sm focus:border-slate-900 focus:ring-slate-900 text-right p-3"
                                    />
                                </td>
                                <td class="px-4 py-3 align-top text-right pt-4 text-slate-900 font-bold font-mono">
                                    <span x-text="formatMoney(calculateTotal(ligne))"></span>
                                </td>
                                <td class="px-4 py-3 align-top text-right">
                                    <button type="button" @click="removeLine(index)" class="p-2 text-slate-400 hover:text-rose-600 transition-colors" title="Supprimer">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                        </tbody>
                        <tfoot class="bg-slate-50 border-t border-slate-200">
                            <tr>
                                <td colspan="5" class="px-4 py-4">
                                    <button type="button" @click="addLine()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 hover:border-slate-400 hover:text-slate-700 font-medium transition-colors flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-plus-circle"></i> Ajouter une ligne
                                    </button>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                
                <!-- Total Section -->
                <div class="bg-slate-900 p-6 flex items-center justify-end gap-6 text-white">
                    <div class="flex items-center gap-3 text-slate-300">
                        <i class="fa-solid fa-calculator text-xl"></i>
                        <span class="text-lg font-medium">Total Estimé</span>
                    </div>
                    <div class="text-3xl font-bold font-mono" x-text="formatMoney(calculateGrandTotal())"></div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4">
                <a th:href="@{/backOffice/stock}" class="px-6 py-3 rounded-xl border border-slate-200 text-slate-700 font-medium hover:bg-slate-50 bg-white w-full md:w-auto text-center">
                    Annuler
                </a>
                <button type="submit" class="px-6 py-3 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-800 shadow-lg shadow-slate-900/20 w-full md:w-auto flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i>
                    Valider le mouvement
                </button>
            </div>
        </form>
    </section>

    <script>
        function stockForm() {
            return {
                lignes: [],
                apiProduitsUrl: document.querySelector('main').dataset.apiProduitsUrl,

                init() {
                    // Initialize with 6 empty lines as requested
                    for(let i=0; i<6; i++) {
                        this.addLine();
                    }
                    
                    // Remove empty lines on submit
                    document.querySelector('form').addEventListener('submit', (e) => {
                        // Filter lines that have product selected
                        let validLines = this.lignes.filter(l => l.produitId !== '');
                        
                        if (validLines.length === 0) {
                            e.preventDefault();
                            alert("Veuillez ajouter au moins un produit valide.");
                            return;
                        }

                        // Remove empty lines from DOM/state before submitting
                        // This prevents validation errors on empty rows
                        if (validLines.length < this.lignes.length) {
                             // If we just update this.lignes, Alpine will update DOM, but form submit might happen before DOM update completes?
                             // Standard form submission grabs current input values.
                             // If we preventDefault, update state, wait for next tick, then submit, it should work.
                             
                             e.preventDefault();
                             this.lignes = validLines;
                             
                             // Wait for Alpine to update DOM
                             this.$nextTick(() => {
                                 e.target.submit();
                             });
                        }
                    });
                },

                addLine() {
                    this.lignes.push({
                        produitId: '',
                        produitQuery: '',
                        produitNom: '',
                        quantite: 1,
                        prixUnitaire: 0,
                        uniteId: '',
                        uniteLibelle: '',
                        availableUnits: [],
                        showSuggestions: false,
                        suggestions: [],
                        loading: false,
                        touched: false
                    });
                },

                removeLine(index) {
                    if (this.lignes.length > 1) {
                        this.lignes.splice(index, 1);
                    }
                },

                async searchProduit(index) {
                    let ligne = this.lignes[index];
                    if (ligne.produitQuery.length < 2) {
                        ligne.suggestions = [];
                        return;
                    }

                    ligne.loading = true;
                    try {
                        let response = await fetch(`${this.apiProduitsUrl}?keyword=${encodeURIComponent(ligne.produitQuery)}`);
                        if (response.ok) {
                            ligne.suggestions = await response.json();
                            ligne.showSuggestions = true;
                        }
                    } catch (e) {
                        console.error("Erreur recherche produit", e);
                    } finally {
                        ligne.loading = false;
                    }
                },

                selectProduit(index, produit) {
                    let ligne = this.lignes[index];
                    ligne.produitId = produit.id;
                    ligne.produitQuery = produit.nom;
                    ligne.produitNom = produit.nom;
                    ligne.suggestions = [];
                    ligne.showSuggestions = false;
                    ligne.availableUnits = produit.prixUnitaires || [];
                    
                    // Auto-select first unit if available
                    if (ligne.availableUnits.length > 0) {
                        ligne.uniteId = ligne.availableUnits[0].uniteId;
                        ligne.uniteLibelle = ligne.availableUnits[0].uniteLibelle;
                        ligne.prixUnitaire = ligne.availableUnits[0].prix;
                    } else {
                        ligne.uniteId = '';
                        ligne.uniteLibelle = '';
                        ligne.prixUnitaire = 0;
                    }
                },
                
                updatePrice(index) {
                    // Price is now fixed based on the first unit
                },

                calculateTotal(ligne) {
                    if (!ligne.produitId || !ligne.quantite) return 0;
                    return (parseFloat(ligne.quantite) * ligne.prixUnitaire) || 0;
                },
                
                calculateGrandTotal() {
                    return this.lignes.reduce((acc, ligne) => acc + this.calculateTotal(ligne), 0);
                },

                formatMoney(amount) {
                    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'MGA' }).format(amount);
                }
            }
        }
    </script>
</main>
</html>
