<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{backoffice/fragments/shell :: shell(~{::main})}">
<main>
    <section>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <div class="text-sm text-slate-500">Entrées</div>
                <div class="mt-2 text-2xl font-semibold" th:text="${totalEntree}">0</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <div class="text-sm text-slate-500">Sorties</div>
                <div class="mt-2 text-2xl font-semibold" th:text="${totalSortie}">0</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-4">
                <div class="text-sm text-slate-500">Ajustements</div>
                <div class="mt-2 text-2xl font-semibold" th:text="${totalAjustement}">0</div>
            </div>
        </div>

        <div class="mt-4 bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div class="px-4 sm:px-6 py-4 border-b border-slate-200 font-semibold">Mouvements récents</div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-600">
                    <tr>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Produit</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Type</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Quantité</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Réf. vente</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Date</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                    <tr th:if="${#lists.isEmpty(mouvements)}">
                        <td class="px-4 sm:px-6 py-10 text-center text-slate-500" colspan="5">Aucun mouvement de stock.</td>
                    </tr>

                    <tr class="hover:bg-slate-50" th:each="m : ${mouvements}">
                        <td class="px-4 sm:px-6 py-3">
                            <div class="font-medium" th:text="${m.produit != null ? m.produit.nom : '-'}">-</div>
                            <div class="text-xs text-slate-500" th:if="${m.produit != null && m.produit.codeBarre != null}" th:text="'Code: ' + ${m.produit.codeBarre}">Code</div>
                        </td>
                        <td class="px-4 sm:px-6 py-3">
                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs"
                                  th:classappend="${m.typeMouvement != null && m.typeMouvement.libelle != null && #strings.equalsIgnoreCase(m.typeMouvement.libelle, 'ENTREE')} ? ' bg-emerald-50 text-emerald-700' : (${m.typeMouvement != null && m.typeMouvement.libelle != null && #strings.equalsIgnoreCase(m.typeMouvement.libelle, 'SORTIE')} ? ' bg-rose-50 text-rose-700' : ' bg-slate-100 text-slate-700')"
                                  th:text="${m.typeMouvement != null ? m.typeMouvement.libelle : '-'}">-</span>
                        </td>
                        <td class="px-4 sm:px-6 py-3" th:text="${m.quantite}">0</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${m.referenceVente != null ? m.referenceVente.id : '-'}">-</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${m.createdAt != null ? #temporals.format(m.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</html>
