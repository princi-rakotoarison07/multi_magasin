<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{backoffice/fragments/shell :: shell(~{::section})}">
<section>
    <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <div class="text-sm text-slate-500">
            Gestion des clients 
            <span th:if="${totalClients != null}" class="text-slate-400">(<span th:text="${totalClients}">0</span> clients)</span>
        </div>
        <div class="flex gap-2">
            <form th:action="@{/backOffice/clients}" method="get" class="flex gap-2">
                <input type="text" name="keyword" placeholder="Rechercher par nom..." 
                       class="w-full sm:w-72 px-3 py-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-sky-200"
                       th:value="${searchKeyword != null ? searchKeyword : ''}" />
                <button type="submit" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm hover:bg-slate-800">Rechercher</button>
            </form>
            <a th:href="@{/backOffice/clients/nouveau}" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm hover:bg-slate-800">Nouveau</a>
        </div>
    </div>

    <div class="mt-4 bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-slate-600">
                    <tr>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">ID</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Nom</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Prénom</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Téléphone</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Email</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Adresse</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Date de création</th>
                        <th class="text-center font-medium px-4 sm:px-6 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                    <tr th:if="${clients == null or #lists.isEmpty(clients)}" class="hover:bg-slate-50">
                        <td colspan="8" class="px-4 sm:px-6 py-8 text-center text-slate-500">
                            Aucun client trouvé
                        </td>
                    </tr>
                    <tr th:each="client : ${clients}" class="hover:bg-slate-50">
                        <td class="px-4 sm:px-6 py-3 font-medium" th:text="${client.id}">1</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${client.nom}">Nom</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${client.prenom != null ? client.prenom : '-'}">Prénom</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${client.telephone != null ? client.telephone : '-'}">Téléphone</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${client.email != null ? client.email : '-'}">Email</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${client.adresse != null ? client.adresse : '-'}">Adresse</td>
                        <td class="px-4 sm:px-6 py-3" th:text="${client.createdAt != null ? #temporals.format(client.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">Date</td>
                        <td class="px-4 sm:px-6 py-3">
                            <div class="flex justify-center">
                                <a th:href="@{/backOffice/clients/modifier/{id}(id=${client.id})}" 
                                   class="inline-flex items-center gap-1 px-3 py-1.5 bg-blue-500 text-white text-xs rounded-lg hover:bg-blue-600 transition-colors duration-200">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                    Modifier
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
