<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{backoffice/fragments/shell :: shell(~{::main})}">
<main>
    <section>
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-6">
            <div>
                <div class="text-sm text-slate-500">Gestion des stocks</div>
                <div class="mt-1 flex items-center gap-2">
                    <div class="text-lg font-semibold text-slate-900">Mouvements de stock</div>
                    <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700" th:text="'Total: ' + ${mouvements.size()}">Total: 0</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a th:href="@{/backOffice/stock/nouveau}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900 text-white text-sm hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20">
                    <i class="fa-solid fa-plus"></i>
                    Nouveau mouvement
                </a>
            </div>
        </div>

        <div th:if="${successMessage != null}" class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-circle-check mt-0.5"></i>
                <div th:text="${successMessage}">Succès</div>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                    <tr>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Date</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Type</th>
                        <th class="text-left font-medium px-4 sm:px-6 py-3">Produit</th>
                        <th class="text-right font-medium px-4 sm:px-6 py-3">Quantité</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                    <tr th:if="${#lists.isEmpty(mouvements)}">
                        <td class="px-4 sm:px-6 py-10 text-center text-slate-500" colspan="4">
                            Aucun mouvement enregistré.
                        </td>
                    </tr>

                    <tr class="hover:bg-slate-50 transition-colors" th:each="m : ${mouvements}">
                        <td class="px-4 sm:px-6 py-3 text-slate-500" th:text="${#temporals.format(m.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td class="px-4 sm:px-6 py-3">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                  th:classappend="${m.typeMouvement.libelle == 'Entrée'} ? 'bg-emerald-100 text-emerald-800' : (${m.typeMouvement.libelle == 'Sortie'} ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800')"
                                  th:text="${m.typeMouvement.libelle}">Type</span>
                        </td>
                        <td class="px-4 sm:px-6 py-3">
                            <div class="font-medium text-slate-900" th:text="${m.produit.nom}">Produit</div>
                            <div class="text-xs text-slate-500" th:text="${m.produit.codeBarre}">Code</div>
                        </td>
                        <td class="px-4 sm:px-6 py-3 text-right font-mono font-medium text-slate-700" th:text="${m.quantite}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</html>
